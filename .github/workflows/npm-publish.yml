name: Publish Node.js Package

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - run: pnpm i
      - run: pnpm test
      - run: pnpm build
      - run: pnpm version from-git --no-git-tag-version
      # npm, not pnpm: pnpm delegates publish to npm but its OIDC handling
      # for trusted publishing is unreliable (pnpm/pnpm#9812, pnpm/pnpm#11513).
      # --access public is redundant with publishConfig, but a release cut
      # before that manifest change would otherwise publish as restricted.
      - run: npm publish --provenance --access public
